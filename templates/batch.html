<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量查询 - CommitRadar</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CommitRadar</h1>
            <p class="subtitle">GitHub提交跟踪与分析工具</p>
            <nav>
                <ul>
                    <li><a href="/">单日查询</a></li>
                    <li><a href="/batch" class="active">批量查询</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="search-section">
                <h2>批量查询GitHub提交记录</h2>
                <div class="search-form">
                    <div class="form-group">
                        <label for="username">GitHub用户名:</label>
                        <input type="text" id="username" placeholder="输入GitHub用户名" required>
                    </div>
                    
                    <div class="form-group">
                        <label>查询模式:</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="mode" value="range" checked> 日期范围
                            </label>
                            <label>
                                <input type="radio" name="mode" value="week"> 整周
                            </label>
                            <label>
                                <input type="radio" name="mode" value="month"> 整月
                            </label>
                        </div>
                    </div>
                    
                    <!-- 日期范围模式 -->
                    <div id="range-mode" class="mode-container">
                        <div class="form-group">
                            <label for="start-date">开始日期:</label>
                            <input type="date" id="start-date">
                        </div>
                        <div class="form-group">
                            <label for="end-date">结束日期:</label>
                            <input type="date" id="end-date">
                        </div>
                    </div>
                    
                    <!-- 整周模式 -->
                    <div id="week-mode" class="mode-container" style="display: none;">
                        <div class="form-group">
                            <label for="week-date">选择周内任意一天:</label>
                            <input type="date" id="week-date">
                        </div>
                    </div>
                    
                    <!-- 整月模式 -->
                    <div id="month-mode" class="mode-container" style="display: none;">
                        <div class="form-group">
                            <label for="month-year">年份:</label>
                            <select id="month-year">
                                <!-- 动态生成年份选项 -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="month">月份:</label>
                            <select id="month">
                                <option value="1">1月</option>
                                <option value="2">2月</option>
                                <option value="3">3月</option>
                                <option value="4">4月</option>
                                <option value="5">5月</option>
                                <option value="6">6月</option>
                                <option value="7">7月</option>
                                <option value="8">8月</option>
                                <option value="9">9月</option>
                                <option value="10">10月</option>
                                <option value="11">11月</option>
                                <option value="12">12月</option>
                            </select>
                        </div>
                    </div>
                    
                    <button id="search-btn" class="btn primary">查询</button>
                </div>
            </section>
            
            <section class="results-section" id="results-container" style="display: none;">
                <h2>查询结果</h2>
                <div class="result-summary">
                    <p>用户 <span id="result-username" class="highlight"></span> 的提交记录:</p>
                    <p class="commit-count">总提交次数: <span id="total-commit-count" class="highlight">0</span></p>
                </div>
                
                <div class="chart-container">
                    <canvas id="commits-chart"></canvas>
                </div>
                
                <div class="commits-table">
                    <h3>提交详情</h3>
                    <table id="commits-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>提交次数</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="commits-tbody">
                            <!-- 提交数据将在这里动态生成 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="export-section">
                    <h3>导出数据</h3>
                    <div class="export-buttons">
                        <button id="export-excel" class="btn secondary">导出为Excel</button>
                        <button id="export-csv" class="btn secondary">导出为CSV</button>
                        <button id="export-json" class="btn secondary">导出为JSON</button>
                    </div>
                </div>
            </section>
            
            <section class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在获取数据，请稍候...</p>
            </section>
            
            <section class="error-message" id="error-container" style="display: none;">
                <p id="error-message"></p>
            </section>
        </main>
        
        <footer>
            <p>CommitRadar &copy; 2023 | <a href="https://github.com/yourusername/commitradar" target="_blank">GitHub</a></p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/batch.js"></script>
</body>
</html>
