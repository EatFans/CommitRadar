<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 提交扫描器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h1 class="text-center">GitHub 提交扫描器</h1>
                    </div>
                    <div class="card-body">
                        <form id="commitForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">GitHub 用户名</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="date" class="form-label">日期 (YYYY-MM-DD)</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">查询提交</button>
                            </div>
                        </form>
                        
                        <div id="loading" class="text-center mt-4 d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p>正在获取数据，请稍候...</p>
                        </div>
                        
                        <div id="results" class="mt-4 d-none">
                            <div class="alert alert-info">
                                <h4 id="resultSummary"></h4>
                            </div>
                            
                            <div id="commitDetails">
                                <h5>提交详情：</h5>
                                <div class="list-group" id="commitList"></div>
                            </div>
                        </div>
                        
                        <div id="error" class="alert alert-danger mt-4 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <!-- 在表单下方添加 -->
    <div class="mt-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="debugMode">
            <label class="form-check-label" for="debugMode">
                调试模式（直接解析HTML）
            </label>
        </div>
        
        <div id="htmlInputContainer" class="mt-3 d-none">
            <form id="testHtmlForm">
                <div class="mb-3">
                    <label for="htmlContent" class="form-label">GitHub贡献页面HTML</label>
                    <textarea class="form-control" id="htmlContent" rows="5" placeholder="粘贴GitHub贡献页面的HTML内容"></textarea>
                </div>
                <div class="mb-3">
                    <label for="testDate" class="form-label">目标日期 (YYYY-MM-DD)</label>
                    <input type="date" class="form-control" id="testDate" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-secondary">解析HTML</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
